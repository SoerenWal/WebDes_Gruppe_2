<?xml version="1.0" encoding="UTF-8"?>
<svg id="o2-warning" width="50" height="50" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes o2-alarm {
            0% { stroke: #FFC300; transform: scale(1); }
            50% { stroke: #FF3333; transform: scale(1.1); }
            100% { stroke: #FFC300; transform: scale(1); }
        }
        #o2-warning circle {
            transform-origin: center;
            animation: o2-alarm 1.5s ease-in-out infinite;
        }
    </style>
    <circle cx="50" cy="50" r="38" stroke="#FFC300" stroke-width="6" fill="rgba(6, 17, 34, 0.9)" />
    <text x="50" y="62" font-family="Aileron, Arial, sans-serif" font-size="35" font-weight="bold" fill="#FFC300" text-anchor="middle">O2</text>
</svg>
