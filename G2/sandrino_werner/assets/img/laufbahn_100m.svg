<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#121212" rx="25" />

  <g font-family="sans-serif" font-size="16" font-weight="bold">
    <text x="100" y="80" fill="#CCFF00" text-anchor="middle">START</text>
    <text x="280" y="80" fill="#888888" text-anchor="middle" font-weight="normal" font-size="14">30m</text>
    <text x="460" y="80" fill="#888888" text-anchor="middle" font-weight="normal" font-size="14">60m</text>
    <text x="700" y="80" fill="#CCFF00" text-anchor="middle">ZIEL (100m)</text>
  </g>

  <g stroke-width="2">
    <line x1="100" y1="100" x2="100" y2="300" stroke="#CCFF00" stroke-width="4" />
    
    <line x1="280" y1="100" x2="280" y2="300" stroke="#555555" stroke-dasharray="6, 6" />
    
    <line x1="460" y1="100" x2="460" y2="300" stroke="#555555" stroke-dasharray="6, 6" />
    
    <line x1="700" y1="100" x2="700" y2="300" stroke="#CCFF00" stroke-width="4" />
  </g>

  <g stroke="#555555" stroke-width="2">
    <line x1="50" y1="100" x2="750" y2="100" />
    
    <line x1="50" y1="150" x2="750" y2="150" stroke-dasharray="12, 12" />
    <line x1="50" y1="200" x2="750" y2="200" stroke-dasharray="12, 12" />
    <line x1="50" y1="250" x2="750" y2="250" stroke-dasharray="12, 12" />
    
    <line x1="50" y1="300" x2="750" y2="300" />
  </g>

  <g font-family="sans-serif" font-size="20" fill="#555555" text-anchor="middle">
    <text x="75" y="132">1</text>
    <text x="75" y="182">2</text>
    <text x="75" y="232">3</text>
    <text x="75" y="282">4</text>
  </g>

</svg>